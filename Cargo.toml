[package]
name = "hope"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.14"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
tokio = { version = "1.35", features = ["full"] }
cosmwasm-std = "1.5"
cw-storage-plus = "1.2"

# iOS FFI dependencies
once_cell = "1.19"
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"
core-foundation = "0.9"
dispatch = "0.2"

[lib]
name = "hope_game"
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "hope"
path = "src/main.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# iOS-specific optimizations
[profile.release-ios]
inherits = "release"
opt-level = "z"  # Optimize for size
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
