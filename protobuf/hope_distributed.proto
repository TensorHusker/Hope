syntax = "proto3";

package hope.distributed;

option java_package = "com.hope.game.distributed.proto";
option java_outer_classname = "HopeDistributedProto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

// ==================== Core Game Messages ====================

message GameOperation {
    enum OperationType {
        UNKNOWN = 0;
        PLAYER_MOVE = 1;
        PLAYER_ACTION = 2;
        STATE_UPDATE = 3;
        ROOM_JOIN = 4;
        ROOM_LEAVE = 5;
        SCORE_UPDATE = 6;
        ITEM_COLLECT = 7;
        ACHIEVEMENT_UNLOCK = 8;
    }
    
    OperationType type = 1;
    string player_id = 2;
    google.protobuf.Timestamp timestamp = 3;
    google.protobuf.Any payload = 4;
    bytes signature = 5;  // Digital signature for Byzantine fault tolerance
}

message GameState {
    uint64 sequence_number = 1;
    uint64 view_number = 2;
    map<string, PlayerState> players = 3;
    map<string, RoomState> rooms = 4;
    google.protobuf.Timestamp last_update = 5;
    bytes state_hash = 6;  // SHA-256 hash of the state
}

message PlayerState {
    string player_id = 1;
    Position position = 2;
    int64 score = 3;
    int32 level = 4;
    repeated string inventory = 5;
    PlayerStatus status = 6;
    map<string, int64> attributes = 7;  // Flexible attribute system
}

message Position {
    float x = 1;
    float y = 2;
    float z = 3;
    float rotation = 4;
}

enum PlayerStatus {
    OFFLINE = 0;
    ONLINE = 1;
    IN_GAME = 2;
    MATCHMAKING = 3;
    SPECTATING = 4;
}

message RoomState {
    string room_id = 1;
    repeated string player_ids = 2;
    RoomStatus status = 3;
    GameMode game_mode = 4;
    map<string, google.protobuf.Any> custom_data = 5;
    int32 max_players = 6;
    google.protobuf.Timestamp created_at = 7;
}

enum RoomStatus {
    WAITING = 0;
    IN_PROGRESS = 1;
    COMPLETED = 2;
    ABANDONED = 3;
}

enum GameMode {
    SOLO = 0;
    COOPERATIVE = 1;
    COMPETITIVE = 2;
    TOURNAMENT = 3;
}

// ==================== Consensus Protocol Messages ====================

message ConsensusMessage {
    oneof message {
        PrePrepareMessage pre_prepare = 1;
        PrepareMessage prepare = 2;
        CommitMessage commit = 3;
        ViewChangeMessage view_change = 4;
        CheckpointMessage checkpoint = 5;
    }
}

message PrePrepareMessage {
    uint64 view = 1;
    uint64 sequence_number = 2;
    bytes operation_digest = 3;
    GameOperation operation = 4;
    string node_id = 5;
    map<string, uint64> vector_clock = 6;
    bytes signature = 7;
}

message PrepareMessage {
    uint64 view = 1;
    uint64 sequence_number = 2;
    bytes operation_digest = 3;
    string node_id = 4;
    bytes signature = 5;
}

message CommitMessage {
    uint64 view = 1;
    uint64 sequence_number = 2;
    bytes operation_digest = 3;
    string node_id = 4;
    bytes signature = 5;
}

message ViewChangeMessage {
    uint64 new_view = 1;
    uint64 last_stable_checkpoint = 2;
    repeated PrepareMessage prepared_messages = 3;
    string node_id = 4;
    bytes signature = 5;
}

message CheckpointMessage {
    uint64 sequence_number = 1;
    bytes state_digest = 2;
    GameState state_snapshot = 3;
    string node_id = 4;
    bytes signature = 5;
}

// ==================== CRDT Messages ====================

message CRDTOperation {
    oneof operation {
        GCounterOp g_counter = 1;
        LWWSetOp lww_set = 2;
        ORSetOp or_set = 3;
    }
}

message GCounterOp {
    string node_id = 1;
    uint64 increment = 2;
    map<string, uint64> vector = 3;
}

message LWWSetOp {
    enum OpType {
        ADD = 0;
        REMOVE = 1;
    }
    OpType type = 1;
    string element = 2;
    google.protobuf.Timestamp timestamp = 3;
}

message ORSetOp {
    enum OpType {
        ADD = 0;
        REMOVE = 1;
    }
    OpType type = 1;
    string element = 2;
    string unique_id = 3;
}

// ==================== Network Messages ====================

message P2PMessage {
    enum MessageType {
        OFFER = 0;
        ANSWER = 1;
        ICE_CANDIDATE = 2;
        DATA = 3;
        HEARTBEAT = 4;
        DISCONNECT = 5;
    }
    
    MessageType type = 1;
    string sender_id = 2;
    string receiver_id = 3;
    google.protobuf.Any payload = 4;
    google.protobuf.Timestamp timestamp = 5;
}

message WebRTCSignal {
    string peer_id = 1;
    string session_description = 2;  // SDP
    repeated IceCandidate ice_candidates = 3;
}

message IceCandidate {
    string candidate = 1;
    string sdp_mid = 2;
    int32 sdp_mline_index = 3;
}

// ==================== Service Messages ====================

service HopeGameService {
    // Authentication
    rpc Authenticate(AuthRequest) returns (AuthResponse);
    rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);
    
    // Game Operations
    rpc JoinGame(JoinGameRequest) returns (JoinGameResponse);
    rpc LeaveGame(LeaveGameRequest) returns (LeaveGameResponse);
    rpc SendGameOperation(GameOperation) returns (OperationAck);
    rpc StreamGameState(StreamStateRequest) returns (stream GameState);
    
    // Matchmaking
    rpc FindMatch(MatchRequest) returns (MatchResponse);
    rpc CancelMatchmaking(CancelMatchRequest) returns (CancelMatchResponse);
    
    // Consensus
    rpc ProposeOperation(GameOperation) returns (ConsensusResult);
    rpc SendConsensusMessage(ConsensusMessage) returns (ConsensusAck);
    
    // P2P Coordination
    rpc GetPeers(GetPeersRequest) returns (GetPeersResponse);
    rpc ExchangeSignaling(stream P2PMessage) returns (stream P2PMessage);
}

message AuthRequest {
    string username = 1;
    string password = 2;
    string device_id = 3;
}

message AuthResponse {
    bool success = 1;
    string jwt_token = 2;
    string refresh_token = 3;
    string player_id = 4;
    string error_message = 5;
}

message RefreshTokenRequest {
    string refresh_token = 1;
}

message JoinGameRequest {
    string player_id = 1;
    string room_id = 2;
    GameMode preferred_mode = 3;
}

message JoinGameResponse {
    bool success = 1;
    string room_id = 2;
    repeated string peer_ids = 3;
    GameState initial_state = 4;
}

message LeaveGameRequest {
    string player_id = 1;
    string room_id = 2;
}

message LeaveGameResponse {
    bool success = 1;
}

message OperationAck {
    bool accepted = 1;
    uint64 sequence_number = 2;
    string error_message = 3;
}

message StreamStateRequest {
    string room_id = 1;
    uint64 from_sequence = 2;
}

message MatchRequest {
    string player_id = 1;
    GameMode game_mode = 2;
    int32 skill_rating = 3;
    map<string, string> preferences = 4;
}

message MatchResponse {
    bool found = 1;
    string room_id = 2;
    repeated string matched_players = 3;
    int32 estimated_wait_seconds = 4;
}

message CancelMatchRequest {
    string player_id = 1;
}

message CancelMatchResponse {
    bool success = 1;
}

message ConsensusResult {
    bool success = 1;
    uint64 sequence_number = 2;
    uint64 view_number = 3;
    string error_message = 4;
}

message ConsensusAck {
    bool received = 1;
}

message GetPeersRequest {
    string room_id = 1;
}

message GetPeersResponse {
    repeated PeerInfo peers = 1;
}

message PeerInfo {
    string peer_id = 1;
    string public_address = 2;
    bool supports_webrtc = 3;
    bool supports_nearby = 4;
    int32 latency_ms = 5;
}

// ==================== Monitoring & Metrics ====================

message SystemMetrics {
    google.protobuf.Timestamp timestamp = 1;
    double cpu_usage = 2;
    double memory_usage = 3;
    int32 active_connections = 4;
    double requests_per_second = 5;
    map<string, double> custom_metrics = 6;
}

message HealthCheck {
    string service_name = 1;
    bool healthy = 2;
    google.protobuf.Timestamp last_check = 3;
    string error_message = 4;
}